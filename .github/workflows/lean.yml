name: Lean build
on:
  push:
  pull_request:
  workflow_dispatch:
defaults:
  run:
    shell: bash -o pipefail {0}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        working-directory: .
        run: lake exe cache get
      - name: Clean build
        working-directory: .
        # The kernel-checked finite verifications (several GB of RAM each) are built one module
        # at a time, then the rest of the library.
        run: |
          lake build OrdowskiA224.FiniteCheck 2>&1 | tee build_ci.txt
          lake build OrdowskiA224.FiniteCheck3 2>&1 | tee -a build_ci.txt
          lake build OrdowskiA224.FiniteCheckPQ2 2>&1 | tee -a build_ci.txt
          # leaves first, so each `lake build` compiles exactly one heavy module
          for m in P5Q23_b0 P5Q23_b1 P5Q23_b2 P5Q23_b3 P5Q23_b4 P5Q23_b5 P5Q23_b6 P5Q23_b7 P5Q23_s1 P5Q23_s2 P5Q23_s3 P5Q23_s4 P5Q23_s5 P5_Q21 P5_Q22 P5_Q23 P5_Q24 P5_Q25 P5_Q26 P5_Q27 P5_Q28 P5_Q29 P5_Q30 P5_0 P5_1 P5_2 P5_3 P5 P3 P7 P11 P13 P17 P19 P23 P29 P31 P37 P41 P43 P47 P53 P59 P61 P67; do
            lake build "OrdowskiA224.FCPQ.$m" 2>&1 | tee -a build_ci.txt
          done
          lake build OrdowskiA224.FiniteCheckPQAll 2>&1 | tee -a build_ci.txt
          lake build 2>&1 | tee -a build_ci.txt
      - name: Axiom report
        working-directory: .
        run: lake env lean Axioms.lean 2>&1 | tee axioms_ci.txt
      - name: No sorry in sources
        run: "! grep -rnw 'sorry' OrdowskiA224 --include=*.lean"
      - name: No sorry warnings in build
        run: "! grep -n \"declaration uses 'sorry'\" build_ci.txt"
      - name: Axiom whitelist
        run: bash scripts/check_axioms.sh axioms_ci.txt
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Machine-check attestation"
            echo "Commit: \`$GITHUB_SHA\`"
            echo "### #print axioms"
            echo '```'; cat axioms_ci.txt 2>/dev/null; echo '```'
            echo "### Build log (last 40 lines)"
            echo '```'; tail -n 40 build_ci.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload attestation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-attestation
          path: |
            build_ci.txt
            axioms_ci.txt
